<%
local api = self.api
-%>
<style>
 #cbi-<%=api.appname%>-socks .td.cbi-value-field > div {
	white-space: nowrap;
}
@media (max-width: 1152px) {
	 #cbi-<%=api.appname%>-socks .td.cbi-value-field > div {
		white-space: normal;
	}
}
</style>
<script type="text/javascript">
	//<![CDATA[
	const shunt_list = <%=self.shunt_list%>;
	const global_cfgid = <%=api.json_script(self.global_cfgid)%>;
	const appname = <%=api.json_script(api.appname)%>;
	const url_node_config = <%=api.json_script(api.url("node_config"))%>;
	const url_socks_config = <%=api.json_script(api.url("socks_config"))%>;
	const url_redir_log = <%=api.json_script(api.url("get_redir_log"))%>;
	const url_socks_log = <%=api.json_script(api.url("get_socks_log"))%>;

	function make_actions(edit_url, log_url) {
		const box = document.createElement("div");
		box.className = "node-actions";
		box.style.cssText = "display:inline-flex; align-items:center; gap:4px; flex-wrap:wrap; margin-left:4px;";
		const edit = document.createElement("a");
		edit.href = "#";
		edit.textContent = <%=api.json_script(translate("Edit"))%>;
		edit.addEventListener("click", function(e) { e.preventDefault(); location.href = edit_url; });
		box.appendChild(edit);
		if (log_url) {
			const log = document.createElement("a");
			log.href = "#";
			log.textContent = <%=api.json_script(translate("Log"))%>;
			log.addEventListener("click", function(e) { e.preventDefault(); window.open(log_url, "_blank"); });
			box.appendChild(log);
		}
		return box;
	}

	function go() {
		var _status = document.getElementsByClassName('_status');
		for (var i = 0; i < _status.length; i++) {
			var id = _status[i].getAttribute("socks_id");
			XHR.get('<%=api.url("socks_status")%>', {
					index: i,
					id: id
				},
				function(x, result) {
					var index = result.index;
					var div = '';
					var div1 = '<font style="font-weight:bold;" color="green">✓</font>&nbsp';
					var div2 = '<font style="font-weight:bold;" color="red">X</font>&nbsp';
					if (result.socks_status) {
						div += div1;
					} else {
						div += div2;
					}
					if (result.use_http) {
						if (result.http_status) {
							div += div1;
						} else {
							div += div2;
						}
					}
					_status[index].innerHTML = div;
				}
			);
		}

		var global_id = null;
		var global = document.getElementById("cbi-<%=api.appname%>-global");
		if (global) {
			var node = global.getElementsByClassName("cbi-section-node")[0];
			var node_id = node.getAttribute("id");
			global_id = node_id;
			var all_node = node.querySelectorAll("[id]");
			var reg1 = /^cbid\..*node\.main$/;

			for (var i = 0; i < all_node.length; i++) {
				var el = all_node[i];
				if (!reg1.test(el.id)) continue;

				var node_select = el;
				if (!node_select) continue;
				var cbid = el.id.replace(/\.main$/, "");
				var hidden_select = document.getElementById(cbid);
				var node_select_value = hidden_select ? hidden_select.options[0].value : "";
				if (!node_select_value || node_select_value.indexOf("_default") === 0 || node_select_value.indexOf("_direct") === 0 || node_select_value.indexOf("_blackhole") === 0) {
					continue;
				}

				var to_url = url_node_config + "/" + encodeURIComponent(node_select_value);
				if (node_select_value.indexOf("Socks_") === 0) {
					to_url = url_socks_config + "/" + encodeURIComponent(node_select_value.substring("Socks_".length));
				}
				var log_url = cbid.match(/\.node$/) ? url_redir_log + "?id=default&name=global" : null;
				node_select.appendChild(make_actions(to_url, log_url));
			}
		}

		var socks = document.getElementById("cbi-<%=api.appname%>-socks");
		if (socks) {
			var socks_enabled_dom = document.getElementById(global_id + "-socks_enabled");
			socks_enabled_dom.parentNode.removeChild(socks_enabled_dom);
			var descr = socks.getElementsByClassName("cbi-section-descr")[0];
			descr.outerHTML = socks_enabled_dom.outerHTML;
			rows = socks.getElementsByClassName("cbi-section-table-row");
			for (var i = 0; i < rows.length; i++) {
				try {
					var row = rows[i];
					var id = row.id;
					if (!id) continue;
					var dom_id = id + "-node";
					var cbid = dom_id.replace("cbi-", "cbid-").replace(new RegExp("-", 'g'), ".");
					dom_id = cbid + ".main";
					var node_select = document.getElementById(dom_id);
					if (!node_select) continue;

					var hidden_select = document.getElementById(cbid);;
					var node_select_value = hidden_select ? hidden_select.options[0].value : "";
					if (node_select_value && node_select_value != "") {
						var to_url = url_node_config + "/" + encodeURIComponent(node_select_value);
						var log_url = url_socks_log + "?name=" + encodeURIComponent(id.replace("cbi-" + appname + "-", ""));
						node_select.insertAdjacentElement("afterend", make_actions(to_url, log_url));
					}
				} catch(err) {
				}
			}
		}
	}
	document.addEventListener("DOMContentLoaded", function () {
		const hiddenSelect = document.getElementById("cbid." + appname + "." + global_cfgid + ".node");
		let o_val = hiddenSelect.value
		const o_hasItem = shunt_list.find(element => element.id == o_val);
		hiddenSelect.addEventListener("change", function(el){
			let new_val = el.target.value
			const new_hasItem = shunt_list.find(element => element.id == new_val);
			if (new_hasItem || (o_hasItem && !new_hasItem)) {
				XHR.get('<%=api.url("update_node")%>', {
					id: global_cfgid,
					data: JSON.stringify({
						node: new_val
					})
				},
				function(x, data) {
					if (x && x.status == 200 && data.code == 1) {
						window.location.reload();
					}
					else {
						alert(<%=api.json_script(translate("Error"))%>);
					}
				});
			}
		});
		go();
	});
</script>
